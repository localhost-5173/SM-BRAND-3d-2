<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SM BRAND — Admin Portal (Phase 4 Placeholder)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/sm.css">
  <style>
    .admin-placeholder {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .admin-card {
      max-width: 520px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      text-align: center;
    }

    .admin-mark {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="admin-placeholder">
    <div class="admin-card">
      <div class="admin-mark">SM</div>
      <h1 style="font-size:24px;margin-bottom:10px">Admin Portal</h1>
      <p style="color:var(--muted);font-size:14px;margin-bottom:24px">
        Backend API &amp; services active (Phase 2). Admin UI dashboard implementation scheduled for Phase 4.
      </p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="/api/health">Check API Health</a>
        <a class="btn btn-ghost" href="/">Return to Website</a>
      </div>
    </div>
  </div>
</body>

</html>
